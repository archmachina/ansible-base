---

name: push_tag_v
on:
  push:
    tags:
      - "v*"

jobs:
  push_tag_v:
    name: "push_tag_v"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: python setup
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: push_tag_v
        shell: bash
        run: |
          ./entrypoint push_tag_v
        env:
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

