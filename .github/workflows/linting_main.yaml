---

name: linting_main
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  linting_main:
    name: "linting_main"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: python setup
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: pr_branch_main
        shell: bash
        run: |
          ./entrypoint lint
